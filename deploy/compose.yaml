services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ai_sync
      POSTGRES_USER: ai_sync
      POSTGRES_PASSWORD: ${AI_SYNC_DB_PASSWORD:?set in local environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_sync -d ai_sync"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AI_SYNC_DATABASE_URL: ${AI_SYNC_DATABASE_URL:?set postgres connection URL in local environment}
      AI_SYNC_STORAGE: /data/packages
      AI_SYNC_OIDC_ISSUER: ${AI_SYNC_OIDC_ISSUER:?set OIDC issuer}
      AI_SYNC_OIDC_AUDIENCE: ${AI_SYNC_OIDC_AUDIENCE:?set API audience}
      AI_SYNC_OIDC_JWKS_URL: ${AI_SYNC_OIDC_JWKS_URL:?set JWKS endpoint}
      AI_SYNC_QUOTA_BYTES: ${AI_SYNC_QUOTA_BYTES:-1073741824}
    volumes:
      - ${AI_SYNC_STORAGE_HOST:?set private package directory}:/data/packages
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      retries: 3
    restart: unless-stopped
  https:
    image: caddy:2.10.2-alpine
    ports: ["443:443", "80:80"]
    environment:
      AI_SYNC_DOMAIN: ${AI_SYNC_DOMAIN:?set DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  certificates:
